[package]
name = "tagmark"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2.5.8"
uuid = { version = "1", features = ["v4"] }
